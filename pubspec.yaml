name: mak_booking
description: M.A.K Booking v2.0 - حجز خدمات التصميم والمواقع والكتابة (عميل / موظف / مدير)
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/mockups/
    - assets/data/

# أيقونة التطبيق تُولَّد من assets/logos/mak_icon.png (استبدل الملف بشعارك)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/mak_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logos/mak_icon.png"
    background_color: "#0B3B3A"
    theme_color: "#0B3B3A"
  windows:
    generate: true
    image_path: "assets/logos/mak_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logos/mak_icon.png"
