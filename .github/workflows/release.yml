name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://efibuqhuyxilvxpylhvr.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        shell: bash
        run: |
          test -f pubspec.yaml || { echo "pubspec.yaml not found"; exit 1; }

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name mak_booking --org ma.mak .
          fi

          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" ||
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="M.A.K Booking"#' "$M"

          # compileSdk للتطبيق الرئيسي
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk(Version)? *=? *flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdk(Version)? *=? *flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
          fi

          # compileSdk لكل المكتبات الفرعية (بما فيها file_picker)
          if [ -f android/build.gradle.kts ]; then
            cat > /tmp/fix.kts <<'EOF'
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          EOF
            cat /tmp/fix.kts android/build.gradle.kts > /tmp/new.kts
            mv /tmp/new.kts android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            cat > /tmp/fix.gradle <<'EOF'
          subprojects {
              plugins.withId('com.android.library') {
                  project.extensions.getByName('android').compileSdkVersion 36
              }
          }
          EOF
            cat /tmp/fix.gradle android/build.gradle > /tmp/new.gradle
            mv /tmp/new.gradle android/build.gradle
          fi

          echo "--- compileSdk ---"
          grep -rn "compileSdk" android --include=*.kts --include=*.gradle || true
          echo "--- root build file head ---"
          head -n 15 android/build.gradle.kts 2>/dev/null || head -n 15 android/build.gradle

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MAK-Booking-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare web platform
        run: |
          test -f pubspec.yaml || { echo "pubspec.yaml not found in repo root"; exit 1; }
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name mak_booking --org ma.mak .
          fi

      - run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          mkdir -p dist
          (cd build/web && zip -r ../../dist/MAK-Booking-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Windows platform
        shell: bash
        run: |
          test -f pubspec.yaml || { echo "pubspec.yaml not found in repo root"; exit 1; }
          if [ ! -d windows ]; then
            flutter create --platforms=windows --project-name mak_booking --org ma.mak .
          fi

      - run: flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release `
            --dart-define="SUPABASE_URL=$env:SUPABASE_URL" `
            --dart-define="SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\MAK-Booking-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
