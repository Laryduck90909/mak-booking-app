name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://efibuqhuyxilvxpylhvr.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        working-directory: .
        shell: bash
        run: |
          PUB=$(find . -maxdepth 3 -name pubspec.yaml -not -path './.git/*' -not -path './app/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          test -n "$PUB" || { echo "pubspec.yaml not found"; exit 1; }
          P=$(dirname "$PUB")
          echo "Project folder: $P"
          mkdir -p app
          (cd "$P" && tar cf - --exclude=./.git --exclude=./app .) | (cd app && tar xf -)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name mak_booking --org ma.mak .
          fi
          test -f android/app/src/main/AndroidManifest.xml
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" ||
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="M.A.K Booking"#' "$M"

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter build apk --release --info \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MAK-Booking-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/dist/*

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        working-directory: .
        shell: bash
        run: |
          PUB=$(find . -maxdepth 3 -name pubspec.yaml -not -path './.git/*' -not -path './app/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          test -n "$PUB" || { echo "pubspec.yaml not found"; exit 1; }
          P=$(dirname "$PUB")
          mkdir -p app
          (cd "$P" && tar cf - --exclude=./.git --exclude=./app .) | (cd app && tar xf -)

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare web platform
        run: flutter create --platforms=web --project-name mak_booking --org ma.mak .

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          mkdir -p dist
          (cd build/web && zip -r ../../dist/MAK-Booking-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/dist/*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        working-directory: .
        shell: bash
        run: |
          PUB=$(find . -maxdepth 3 -name pubspec.yaml -not -path './.git/*' -not -path './app/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          test -n "$PUB" || { echo "pubspec.yaml not found"; exit 1; }
          P=$(dirname "$PUB")
          mkdir -p app
          (cd "$P" && tar cf - --exclude=./.git --exclude=./app .) | (cd app && tar xf -)

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Windows platform
        run: flutter create --platforms=windows --project-name mak_booking --org ma.mak .

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      - name: Build Windows
        run: |
          flutter build windows --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\MAK-Booking-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
